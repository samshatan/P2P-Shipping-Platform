services:

  redis:
    image: redis:7-alpine
    container_name: swiftroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:6
    container_name: swiftroute-mongodb
    environment:
      MONGO_INITDB_DATABASE: swiftroute_tracking
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
